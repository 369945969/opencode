name: 🔄 Sync Upstream

on:
  schedule:
    # 每天北京时间早上8点检查一次（UTC+8对应0点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许你手动点按钮运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git 
          git fetch upstream

      - name: Check for updates and auto-resolve conflicts
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          LOCAL_SHA=$(git rev-parse origin/dev)
          
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "上游有新提交: $UPSTREAM_SHA"
            
            # 配置git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # 尝试合并上游代码
            if git merge upstream/dev --no-edit --allow-unrelated-histories; then
              echo "合并成功，无冲突"
            else
              echo "检测到冲突，自动使用上游版本覆盖..."
              # 强制使用上游版本解决所有冲突
              git checkout --theirs .
              # 添加所有变更
              git add .
              # 提交合并结果（使用 --no-edit 保留原始合并信息）
              git commit -m "merge: sync upstream and resolve conflicts using upstream version"
              echo "已自动解决冲突"
            fi
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "暂无更新"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream-sync  # 临时分支名
          delete-branch: true    # 合并后自动删除
          title: '⬆️ Sync: 上游仓库更新 (${{ github.run_id }})'
          body: |
            ### 🔔 检测到上游仓库有更新
            
            **此 PR 已自动处理合并冲突，优先采用上游版本。**
            
            **请确认以下事项：**
            1. 点击上方 **Files changed** 查看具体修改
            2. 检查是否有你的重要代码被覆盖（如果不需要覆盖，请手动解决冲突）
            3. 确认无误后点击 **Merge pull request**
            
            <details>
            <summary>📋 查看差异</summary>
            
            ```bash
            # 本地执行查看差异
            git fetch upstream
            git log HEAD..upstream/dev --oneline
            ```
            </details>
            
            ---
            *自动创建时间: ${{ github.event.repository.updated_at }}*
          base: dev
          labels: |
            upstream-sync
            automated

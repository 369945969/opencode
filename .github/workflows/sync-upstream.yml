name: 🔄 Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 代替 GITHUB_TOKEN
          token: ${{ secrets.PAT }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git 
          git fetch upstream

      - name: Check for updates and auto-resolve conflicts
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          LOCAL_SHA=$(git rev-parse origin/dev)
          
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "上游有新提交: $UPSTREAM_SHA"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            if git merge upstream/dev --no-edit --allow-unrelated-histories; then
              echo "合并成功，无冲突"
            else
              echo "检测到冲突，自动使用上游版本覆盖..."
              git checkout --theirs .
              git add .
              git commit -m "merge: sync upstream and resolve conflicts using upstream version"
              echo "已自动解决冲突"
            fi
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "暂无更新"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          # 这里也要用 UPSTREAM_SYNC_TOKEN
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          branch: upstream-sync
          delete-branch: true
          title: '⬆️ Sync: 上游仓库更新 (${{ github.run_id }})'
          body: |
            ### 🔔 检测到上游仓库有更新
            
            **此 PR 已自动处理合并冲突，优先采用上游版本。**
            
            **请确认以下事项：**
            1. 点击上方 **Files changed** 查看具体修改
            2. 检查是否有你的重要代码被覆盖
            3. 确认无误后点击 **Merge pull request**
            
            <details>
            <summary>📋 查看差异</summary>
            
            ```bash
            git fetch upstream
            git log HEAD..upstream/dev --oneline
            ```
            </details>
          base: dev
          labels: |
            upstream-sync
            automated

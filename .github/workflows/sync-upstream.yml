name: 🔄 Sync Upstream

on:
  schedule:
    # 每天北京时间早上8点检查一次（UTC+8对应0点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许你手动点按钮运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git 
          git fetch upstream

      - name: Check for updates and apply
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          LOCAL_SHA=$(git rev-parse origin/dev)
          
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "上游有新提交: $UPSTREAM_SHA"
            # ⚠️ 关键步骤：配置git并合并上游到工作目录（产生文件变更）
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge upstream/dev --no-edit --allow-unrelated-histories
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "暂无更新"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream-sync  # 临时分支名
          delete-branch: true    # 合并后自动删除
          title: '⬆️ Sync: 上游仓库更新 (${{ github.run_id }})'
          body: |
            ### 🔔 检测到上游仓库有更新
            
            **请审查以下变更后再合并：**
            
            1. 点击上方 **Files changed** 查看具体修改
            2. 确认无误后点击 **Merge pull request**
            3. 如有冲突，需要在本地解决
            
            <details>
            <summary>📋 查看上游提交记录</summary>
            
            ```bash
            # 本地执行查看差异
            git fetch upstream
            git log HEAD..upstream/dev --oneline
            ```
            </details>
            
            ---
            *自动创建时间: ${{ github.event.repository.updated_at }}*
          base: dev
          labels: |
            upstream-sync
            automated
